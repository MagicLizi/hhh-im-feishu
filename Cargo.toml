[package]
name = "hhh-im-feishu"
version = "1.0.2"
edition = "2024"
publish = false
license = "MIT"
description = "飞书：HHH 的飞书 IM 插件（从 HHH 内置的飞书适配器搬出来）"

# 库：飞书适配器本体（统一消息类型、授权、平台接口封装与翻译）；集成测试与插件程序都用它。
[lib]
name = "hhh_im_feishu"
path = "src/lib.rs"

# 插件程序：HHH 拉起的子进程，按 HHH-IM-Protocol v1 走标准输入输出。
[[bin]]
name = "hhh-im-feishu"
path = "src/main.rs"

[dependencies]
# 协议包：线上类型与 JSON-RPC 编解码，按标签取 hhh-im-sdk 的固定版本。
hhh-im-protocol = { git = "https://github.com/MagicLizi/hhh-im-sdk", tag = "v0.2.0" }
# serde：序列化框架；derive = 在类型上一行 #[derive(Serialize, Deserialize)] 自动生成编解码。
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# reqwest：HTTP 客户端。不带系统 TLS，统一用 rustls；TLS 配置由 net 模块组好整份交给它。
# json = 请求体直接塞 JSON；gzip = 声明并自动解压 gzip 响应；stream = 按块读响应体；
# multipart = 上传要发送的图片与文件（表单分段请求）。
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots-no-provider", "json", "gzip", "stream", "multipart"] }
# rustls：TLS 协议实现，加密后端 aws-lc-rs；prefer-post-quantum 让握手优先抗量子密钥交换 X25519MLKEM768
# 并同时带 X25519（飞书会单独掐断老式的小握手，见 net 模块说明）。
rustls = { version = "0.23.27", default-features = false, features = ["aws_lc_rs", "prefer-post-quantum", "std", "tls12", "logging"] }
# webpki-roots：内置公共根证书，不读系统证书库，各平台行为一致。
webpki-roots = "1"
# tracing：日志门面。库代码只发日志事件，插件程序把它转成协议的 log/write 交给宿主。
tracing = "0.1"
# getrandom：操作系统级随机数（授权 state、操作编号）。
getrandom = "0.3"
# linkify：在纯文字里找网址（翻译消息时把网址整理成链接）。
linkify = "0.10"
# markdown（markdown-rs）：解析飞书明确标为 Markdown 的内容（富文本 md 节点、卡片 markdown）。
markdown = "1"
# tokio：异步运行时。协议服务读标准输入、写标准输出、并发处理宿主的请求；task_local 数一次宿主调用里发了几次平台请求。
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "macros", "io-std", "io-util", "sync", "time"] }
# base64：资源分段、上传分段在协议里按 base64 传；分页游标也编成 base64 的不透明字符串。
base64 = "0.22"
# sha2：核对上传内容的 SHA-256（协议 uploads/finish）。
sha2 = "0.11"
# tracing-subscriber：把库里的 tracing 日志接成协议的 log/write 通知（只开最小的注册表部件）。
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "registry"] }

[dev-dependencies]
# 异步测试；test-util 是可暂停的虚拟时钟，net 让测试能起本机服务。
tokio = { version = "1", default-features = false, features = ["macros", "rt-multi-thread", "time", "test-util", "net"] }
# wiremock：测试用的本机假飞书服务与假授权中继，验证请求形状与错误分级。
wiremock = "0.6"
# 测试里用宿主那一侧的连接层（transport）当宿主，跟插件按协议说话。
hhh-im-protocol = { git = "https://github.com/MagicLizi/hhh-im-sdk", tag = "v0.2.0", features = ["transport"] }
# regex-lite：宿主认头像身份用的正则库，测试里拿它核对声明的写法与内置的认法一致。
regex-lite = "0.1"

[lints.rust]
# 从第一天起保持零警告（与 HHH 相同）。
warnings = "deny"

[profile.release]
strip = true
lto = true
codegen-units = 1
